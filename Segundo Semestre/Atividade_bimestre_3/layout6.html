<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabela de preços</title>
</head>
<body>

    <header>
        <h1 class="title_2">Tabela de Preços</h1>
    </header>
    <div class="planos">
        <div class="plano_base">
            <h3 id="precos_title">Plano Básico</h3>
            <p id="preco">29/ mês</p>
            <ul id="list">
                <li id="li">5 projetos</li>
                <li id="li">10 GB de Armazenamento</li>
                <li id="li">Suporte por e-mail</li>
            </ul>
            <button id="botao">Começar</button>
        </div>

        <div class="plano_pro">
            <h3 id="preco_title_pro">Plano Pro</h3>
            <p id="preco_pro">79/ mês</p>
            <ul id="list_pro">
                <li id="li_pro">25 projetos</li>
                <li id="li_pro_2">50 GB de Armazenamento</li>
                <li id="li_pro_3">Suporte prioritário</li>
            </ul>
            <section id="section">
            <button id="botao_pro">Começar</button>
            </section>
        </div>

        <div class="planos">
        <div class="plano_base">
            <h3 id="precos_title">Plano Empresarial</h3>
            <p id="preco">199/ mês</p>
            <ul id="list">
                <li id="li">Projetos Ilimitados</li>
                <li id="li">200 GB de Armazenamento</li>
                <li id="li">Suporte 24/7</li>
            </ul>
            <button id="botao">Contato</button>
        </div>
    </div>
</body>
</html>
